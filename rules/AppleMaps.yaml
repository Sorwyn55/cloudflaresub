# Apple Maps — Egern rules, synchronized with AppleMaps_Loon.list (2026-10-29)
# Routing: import as remote Rule Set -> DIRECT.
# DNS: if already using this same rule set under DNS Forward -> TencentDNS,
#      it will use the updated matching domains too (DNS policy is configured in Egern).
# 31 precise domain/suffix entries matching Loon; replaces older broad gsp*/gspe*
# wildcards so other Apple services (e.g. gspe1-ssl region checks) aren't redirected.
# No broad match on apple.com, ls.apple.com, or smoot.apple.com.

domain_set:
  - maps.apple
  - maps.apple.com
  - maps.apple.com.cn
  - configuration.ls.apple.com
  - configuration.ls.apple.cn
  - gspe35-ssl.ls.apple.com
  - gspe35-ssl.ls.apple.cn
  - sundew.ls.apple.com
  - gs-loc.apple.com
  - gs-loc-cn.apple.com
  - gsp-ssl.ls.apple.com
  - gsp10-ssl-cn.ls.apple.com
  - gsp12-cn.ls.apple.com
  - gsp13-cn.ls.apple.com
  - gsp4-cn.ls.apple.com
  - gsp5-cn.ls.apple.com
  - gsp85-cn-ssl.ls.apple.com
  - gspe11-2-cn-ssl.ls.apple.com
  - gspe12-ssl.ls.apple.com
  - gspe12-cn-ssl.ls.apple.com
  - gspe19-ssl.ls.apple.com
  - gspe19-cn-ssl.ls.apple.com
  - gspe19-2-cn-ssl.ls.apple.com
  - gspe19-cn.ls.apple.com
  - gspe21-ssl.ls.apple.com
  - gspe21.ls.apple.com
  - gspe79-cn-ssl.ls.apple.com
  - gspe85-cn-ssl.ls.apple.com
  - cdn2.smoot.apple.com

domain_suffix_set:
  - apple-mapkit.com
  - is.autonavi.com
