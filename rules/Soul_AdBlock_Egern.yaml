  - http_response:
      name: "Soul HTTPDNS"
      match: '^https?://47\.110\.187\.87/winterfell/v2/getIpByDomain'
      script_url: "https://raw.githubusercontent.com/Sorwyn55/cloudflaresub/main/scripts/Soul_AdBlock_Egern.js"
      body_required: true
