mitm:
  hostnames:
    includes:
      - "47.110.187.87"
      - "ssp.soulapp.cn"
      - "chat-live.soulapp.cn"
      - "api-chat.soulapp.cn"
      - "api-account.soulapp.cn"
      - "api-a.soulapp.cn"
      - "gateway-mobile-gray.soulapp.cn"
      - "post.soulapp.cn"
      - "api-user.soulapp.cn"
