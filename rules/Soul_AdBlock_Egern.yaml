name: "Soul 去广告"
description: "Soul iOS 去广告。2026-11-03 按 fmz200/wool_scripts 当前 Soul 规则更新；保留原订阅链接。"
author: "fmz200 / Sorwyn55 maintenance"
homepage: "https://github.com/fmz200/wool_scripts"
icon: "shield.lefthalf.filled"

# 只处理广告/运营接口，不在本模块里强制 Soul 全域 DIRECT。
# Soul 的本地直连/重庆语音网络策略请继续交给独立分流规则，避免去广告模块和网络策略互相抢规则。
rules:
  - domain:
      match: "soul-ad.soulapp.cn"
      policy: REJECT
  - domain:
      match: "ad-r.soulapp.cn"
      policy: REJECT
  - domain:
      match: "ad-reward.soulapp.cn"
      policy: REJECT
  - domain_suffix:
      match: "cdn.soulapp.cn"
      policy: REJECT
  - ip_cidr:
      match: "47.56.131.76/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "47.97.215.55/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "47.99.42.29/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "120.27.235.201/32"
      policy: REJECT
      no_resolve: true
  - ip_cidr:
      match: "121.196.197.147/32"
      policy: REJECT
      no_resolve: true

map_locals:
  - match: '^https?://ssp\.soulapp\.cn/api/q'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https?://ssp\.soulapp\.cn/api/ad/config'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https?://chat-live\.soulapp\.cn/live/planet/recListV2'
    status_code: 200
    body: ' '
  - match: '^https?://api-chat\.soulapp\.cn/chat/entrance/first'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'

scriptings:
  - http_response:
      name: "Soul 青少年模式弹窗"
      match: '^https?://api-account\.soulapp\.cn/teenager/config'
      script_url: "https://raw.githubusercontent.com/Sorwyn55/cloudflaresub/main/scripts/Soul_AdBlock_Egern.js"
      body_required: true
      timeout: 60
  - http_response:
      name: "Soul 礼物榜推广"
      match: '^https?://api-a\.soulapp\.cn/v2/post/gift/list'
      script_url: "https://raw.githubusercontent.com/Sorwyn55/cloudflaresub/main/scripts/Soul_AdBlock_Egern.js"
      body_required: true
      timeout: 60
  - http_response:
      name: "Soul 官方场景推广"
      match: '^https?://api-a\.soulapp\.cn/official/scene/module'
      script_url: "https://raw.githubusercontent.com/Sorwyn55/cloudflaresub/main/scripts/Soul_AdBlock_Egern.js"
      body_required: true
      timeout: 60
  - http_response:
      name: "Soul 运营位"
      match: '^https?://api-user\.soulapp\.cn/furion/position/content'
      script_url: "https://raw.githubusercontent.com/Sorwyn55/cloudflaresub/main/scripts/Soul_AdBlock_Egern.js"
      body_required: true
