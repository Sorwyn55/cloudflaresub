# Egern module: Claude traffic routing (2026-11-20)
# Change CLAUDE_POLICY to an existing Egern proxy/policy group.
# Only verified *exact* shared service endpoints are enabled; other shared endpoints stay disabled.
name: "Claude · 流量分流"
description: "Claude 核心域名与 Anthropic IP/ASN 分流，部分共享第三方精确域名已启用。"
author: "ChatGPT"
homepage: "https://ip.net.coffee/claude/site.html"
compat_arguments:
  CLAUDE_POLICY: "Proxy"
rules:
  - domain_suffix:
      match: "anthropic.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claude.ai"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claude.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claude.app"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "clau.de"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claudemcpclient.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claudemcpcontent.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "claudeusercontent.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "servd-anthropic-website.b-cdn.net"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "anthropic.com.cdn.cloudflare.net"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "anthropic.auth0.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "anthropic-com.ghost.io"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "browser-intake-us5-datadoghq.com"
      policy: "{{{CLAUDE_POLICY}}}"
  # Verified in claude.ai CSP (Intercom), and Anthropic official Claude Code network docs (Datadog):
  - domain:
      match: "api-iam.intercom.io"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "nexus-websocket-a.intercom.io"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "http-intake.logs.us5.datadoghq.com"
      policy: "{{{CLAUDE_POLICY}}}"
  # User opted in to force these exact shared-service domains via Claude policy; may also affect unrelated apps.
  - domain:
      match: "r.stripe.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "us.sentry.io"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "siftscience.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain:
      match: "fcmtoken.googleapis.com"
      policy: "{{{CLAUDE_POLICY}}}"
  - domain_suffix:
      match: "sentry.io"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_suffix:
      match: "statsigapi.net"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_suffix:
      match: "intercom.io"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_suffix:
      match: "intercomcdn.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_suffix:
      match: "withpersona.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_suffix:
      match: "frompersona.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain:
      match: "cdn.usefathom.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain:
      match: "maps.googleapis.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_keyword:
      match: "datadog"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_keyword:
      match: "sentry"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain_keyword:
      match: "sift"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - ip_cidr:
      match: "160.79.104.0/23"
      policy: "{{{CLAUDE_POLICY}}}"
      no_resolve: true
  - ip_cidr:
      match: "153.61.224.0/22"
      policy: "{{{CLAUDE_POLICY}}}"
      no_resolve: true
  - ip_cidr6:
      match: "2607:6bc0::/48"
      policy: "{{{CLAUDE_POLICY}}}"
      no_resolve: true
  - asn:
      match: "AS399358"
      policy: "{{{CLAUDE_POLICY}}}"
      no_resolve: true
  - domain:
      match: "cloudflare-dns.com"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
  - domain:
      match: "dns.google"
      policy: "{{{CLAUDE_POLICY}}}"
      disabled: true
